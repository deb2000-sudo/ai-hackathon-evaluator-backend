steps:
  # Step 1: Ensure Artifact Registry repository exists (required before first push)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - 'gcloud artifacts repositories describe ai-hackathon-evaluator-backend --location=asia-south1 || gcloud artifacts repositories create ai-hackathon-evaluator-backend --repository-format=docker --location=asia-south1 --description="Docker repository for AI Hackathon Evaluator Backend"'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-hackathon-evaluator-backend/ai-hackathon-evaluator-backend:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-hackathon-evaluator-backend/ai-hackathon-evaluator-backend:latest'
      - '.'

  # Step 3: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-hackathon-evaluator-backend/ai-hackathon-evaluator-backend:$SHORT_SHA'

  # Step 4: Ensure submission-video bucket exists (+ CORS for browser PUT uploads)
  # Note: bash vars must use $$ so Cloud Build does not treat them as substitutions.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        BUCKET=gs://$PROJECT_ID-hackathon-evaluations
        gcloud storage buckets describe "$$BUCKET" || gcloud storage buckets create "$$BUCKET" --location=us-central1 --uniform-bucket-level-access
        cat > /tmp/cors.json <<'EOF'
        [
          {
            "origin": ["https://hackniat.vercel.app", "http://localhost:3000", "http://localhost:5173"],
            "method": ["GET", "PUT", "HEAD", "OPTIONS"],
            "responseHeader": ["Content-Type", "Content-Length", "x-goog-resumable"],
            "maxAgeSeconds": 3600
          }
        ]
        EOF
        gcloud storage buckets update "$$BUCKET" --cors-file=/tmp/cors.json

  # Step 5: Cloud Tasks queue for durable AI evaluation (Phase 2)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud tasks queues describe evaluation-jobs --location=asia-south1 \
          || gcloud tasks queues create evaluation-jobs --location=asia-south1

  # Step 6: Deploy to Cloud Run, then set Cloud Tasks target URL to this revision's URL
  # Prerequisite: Secret Manager secret INTERNAL_JOB_SECRET must already exist (see README).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run deploy ai-hackathon-evaluator-backend \
          --image=asia-south1-docker.pkg.dev/$PROJECT_ID/ai-hackathon-evaluator-backend/ai-hackathon-evaluator-backend:$SHORT_SHA \
          --region=asia-south1 \
          --allow-unauthenticated \
          --update-secrets=FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,FIREBASE_WEB_API_KEY=FIREBASE_WEB_API_KEY:latest,FIREBASE_DATABASE_URL=FIREBASE_DATABASE_URL:latest,INTERNAL_JOB_SECRET=INTERNAL_JOB_SECRET:latest \
          --set-env-vars=ENVIRONMENT=production,DEBUG=false,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,EVALUATION_BUCKET_NAME=$PROJECT_ID-hackathon-evaluations,GEMINI_MODEL=gemini-3.5-flash,GEMINI_ENTERPRISE=true,COOKIE_SAMESITE=none,ALLOWED_ORIGINS=https://hackniat.vercel.app,EVALUATION_JOB_MODE=cloud_tasks,CLOUD_TASKS_LOCATION=asia-south1,CLOUD_TASKS_QUEUE=evaluation-jobs \
          --memory=1Gi \
          --cpu=1 \
          --timeout=3600

        SERVICE_URL=$$(gcloud run services describe ai-hackathon-evaluator-backend \
          --region=asia-south1 --format='value(status.url)')
        gcloud run services update ai-hackathon-evaluator-backend \
          --region=asia-south1 \
          --update-env-vars=CLOUD_TASKS_TARGET_URL=$${SERVICE_URL}/internal/jobs/evaluate-submission

        # Allow the Cloud Run runtime SA to enqueue tasks
        PROJECT_NUMBER=$$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
        RUNTIME_SA=$${PROJECT_NUMBER}-compute@developer.gserviceaccount.com
        gcloud projects add-iam-policy-binding $PROJECT_ID \
          --member="serviceAccount:$${RUNTIME_SA}" \
          --role="roles/cloudtasks.enqueuer" \
          --condition=None \
          --quiet || true
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-south1'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-hackathon-evaluator-backend/ai-hackathon-evaluator-backend:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ai-hackathon-evaluator-backend/ai-hackathon-evaluator-backend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  # Fix for the build error - use Cloud Logging only
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'

# Note: For production, consider using Secret Manager for sensitive values instead of substitutions.
# See: https://cloud.google.com/build/docs/securing-builds/use-secrets
